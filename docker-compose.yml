# Deploy satu server: PostgreSQL, Redis, MinIO, API, worker, dan panel admin (nginx).
#
#   cp .env.example .env   # lalu ubah password/secret
#   docker compose up -d --build
#   docker compose run --rm api node dist/db/seed.js          # admin awal
#   docker compose run --rm api node dist/db/seed.js --demo   # (opsional) data contoh
#
# Panel admin: http://<server>:8080   ·  API docs: http://<server>:8080/docs
# Aplikasi desktop diarahkan ke http://<server>:8080 (endpoint /api/sync/*).

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://cbt:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}@postgres:5432/cbt
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?isi MINIO_ROOT_USER di .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?isi MINIO_ROOT_PASSWORD di .env}
  S3_BUCKET: cbt
  JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
  JWT_ADMIN_TTL: ${JWT_ADMIN_TTL:-12h}
  JWT_SITE_TTL: ${JWT_SITE_TTL:-24h}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cbt
      POSTGRES_USER: cbt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbt -d cbt"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF agar job antrean tidak hilang saat restart; noeviction wajib untuk BullMQ.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Image resmi minio/minio sudah tidak ada di Docker Hub, jadi dibangun dari source.
    build: deploy/minio
    image: cbt-minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    # Console MinIO hanya di localhost server (akses lewat SSH tunnel).
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: ., target: server }
    image: cbt-server:latest
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: cbt-server:latest
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment: *app-env
    depends_on:
      api: { condition: service_healthy }

  admin:
    build: { context: ., target: admin }
    image: cbt-admin:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
