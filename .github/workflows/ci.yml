name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cbt
          POSTGRES_PASSWORD: cbt
          POSTGRES_DB: cbt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cbt" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - name: Jalankan MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit test (skema & penilaian)
        run: pnpm --filter @cbt/shared test
      - name: Tes integrasi server
        run: pnpm --filter @cbt/server test
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image server
        run: docker build --target server -t cbt-server .
      - name: Build image admin
        run: docker build --target admin -t cbt-admin .
